{% if page.show_cta %}
<section class="container-fluid cta-banner py-5" id="cta">
    <div class="container py-5">
        <div class="row align-items-center g-4">
            <div class="col-lg-8 wow fadeInUp" data-wow-delay="0.1s">
                <h2 class="display-5 text-white text-uppercase mb-3">{{ page.cta_title }}</h2>
                {% if page.cta_text %}<p class="fs-5 text-white mb-0">{{ page.cta_text }}</p>{% endif %}
            </div>
            {% if page.cta_button_text %}
            <div class="col-lg-4 text-lg-end wow fadeInUp" data-wow-delay="0.3s">
                <a href="{{ page.cta_button_link|default:'#newsletter' }}" class="btn btn-light btn-lg py-3 px-5">{{ page.cta_button_text }}<i class="fa-solid fa-arrow-right ms-2"></i></a>
                {% if site.phone %}
                <p class="mt-3 mb-0 text-white">or call <a class="text-white fw-bold" href="tel:{{ site.phone }}">{{ site.phone }}</a></p>
                {% endif %}
            </div>
            {% endif %}
        </div>
    </div>
</section>
{% endif %}
