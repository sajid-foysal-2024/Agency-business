{% if stats %}
<section class="container-fluid stats-bar py-5" aria-label="Our numbers">
    <div class="container">
        <div class="row g-4 justify-content-center text-center">
            {% for stat in stats %}
            <div class="col-6 col-lg-3 wow fadeInUp" data-wow-delay="{% cycle '0.1s' '0.2s' '0.3s' '0.4s' %}">
                <div class="stat-item">
                    {% if stat.icon %}<i class="{{ stat.icon }} text-primary mb-3"></i>{% endif %}
                    <h2 class="display-5 mb-1"><span class="counter" data-target="{{ stat.number }}">{{ stat.number }}</span>{{ stat.suffix }}</h2>
                    <p class="text-uppercase mb-0">{{ stat.label }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
