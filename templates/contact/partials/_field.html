{# One form field with label and error. Param: field #}
<div class="contact-field">
    <label for="{{ field.id_for_label }}" class="form-label">
        {{ field.label }}{% if field.field.required %}<span class="text-primary" aria-hidden="true"> *</span>{% endif %}
    </label>
    {{ field }}
    {% if field.errors %}
    <div class="invalid-feedback d-block" id="{{ field.auto_id }}_error">{{ field.errors|join:" " }}</div>
    {% endif %}
</div>
