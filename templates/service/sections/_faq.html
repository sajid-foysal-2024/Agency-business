{% if faqs %}
<section class="container-fluid py-5 bg-secondary" id="faq">
    <div class="container py-5">
        <div class="text-center">
            {% include "partials/_section_title.html" with subtitle="FAQ" title="Frequently Asked Questions" %}
        </div>
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="accordion service-faq" id="faqAccordion">
                    {% for faq in faqs %}
                    <div class="accordion-item wow fadeInUp" data-wow-delay="{% cycle '0.1s' '0.15s' '0.2s' %}">
                        <h3 class="accordion-header" id="faq-heading-{{ faq.pk }}">
                            <button class="accordion-button{% if not forloop.first %} collapsed{% endif %}" type="button"
                                data-bs-toggle="collapse" data-bs-target="#faq-{{ faq.pk }}"
                                aria-expanded="{% if forloop.first %}true{% else %}false{% endif %}" aria-controls="faq-{{ faq.pk }}">
                                {{ faq.question }}
                            </button>
                        </h3>
                        <div id="faq-{{ faq.pk }}" class="accordion-collapse collapse{% if forloop.first %} show{% endif %}"
                            aria-labelledby="faq-heading-{{ faq.pk }}" data-bs-parent="#faqAccordion">
                            <div class="accordion-body">{{ faq.answer|linebreaksbr }}</div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</section>
{% endif %}
