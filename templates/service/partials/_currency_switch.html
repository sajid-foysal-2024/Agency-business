{# BDT / USD toggle. Works with every price inside the surrounding .currency-scope (see services.js) #}
<div class="currency-switch wow fadeInUp" data-wow-delay="0.2s" role="group" aria-label="Choose currency">
    <span class="currency-switch-indicator" aria-hidden="true"></span>
    <button type="button" class="currency-option" data-set-currency="bdt" aria-pressed="true">৳ BDT</button>
    <button type="button" class="currency-option" data-set-currency="usd" aria-pressed="false">$ USD</button>
</div>
