{% url 'home:index' as home_url %}
<nav class="navbar navbar-expand-lg navbar-dark px-lg-5">
    <a href="{{ home_url }}" class="navbar-brand ms-4 ms-lg-0">
        <h2 class="mb-0 text-primary">{% include "partials/_brand.html" %}</h2>
    </a>
    <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
        aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarCollapse">
        <div class="navbar-nav mx-auto p-4 p-lg-0">
            <a href="{{ home_url }}" class="nav-item nav-link{% if request.path == home_url %} active{% endif %}">Home</a>
            <a href="{{ home_url }}#about" class="nav-item nav-link">About</a>
            <a href="{% url 'services:list' %}" class="nav-item nav-link{% if request.resolver_match.app_name == 'services' %} active{% endif %}">Services</a>
            <a href="{% url 'developers:list' %}" class="nav-item nav-link{% if request.resolver_match.app_name == 'developers' %} active{% endif %}">Developers</a>
            <a href="{{ home_url }}#testimonial" class="nav-item nav-link">Shop</a>
            <a href="{% url 'contact:index' %}" class="nav-item nav-link{% if request.resolver_match.app_name == 'contact' %} active{% endif %}">Contact</a>
            {% if user.is_authenticated %}
            <a href="{% url 'orders:dashboard' %}" class="nav-item nav-link{% if request.resolver_match.url_name == 'dashboard' %} active{% endif %}">My Account</a>
            {% else %}
            <a href="{% url 'accounts:login' %}" class="nav-item nav-link{% if request.resolver_match.app_name == 'accounts' %} active{% endif %}">Log in</a>
            {% endif %}
        </div>
        {% if site.header_button_text %}
        <a href="{{ site.header_button_link|default:'#' }}" class="btn btn-primary py-2 px-4 ms-4 ms-lg-0 mb-3 mb-lg-0 header-btn">{{ site.header_button_text }}</a>
        {% endif %}
    </div>
</nav>
