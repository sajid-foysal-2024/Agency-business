{% if developer.services.all %}
<section class="container-fluid py-5" id="my-services">
    <div class="container py-5">
        {% include "partials/_section_title.html" with subtitle="What I Do" title="My Services" align="left" %}
        <div class="row g-4">
            {% for service in developer.services.all %}
            <div class="col-lg-4 col-md-6 wow fadeInUp" data-wow-delay="{% cycle '0.1s' '0.3s' '0.5s' %}">
                <div class="portfolio-service text-center h-100">
                    <div class="icon"><i class="{{ service.icon|default:'fa-solid fa-code' }}"></i></div>
                    <h3 class="text-uppercase">{{ service.title }}</h3>
                    {% if service.description %}<p class="mb-0">{{ service.description }}</p>{% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
